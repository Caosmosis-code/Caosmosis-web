spring.application.name=demo


# ============================================================
# DATABASE
# ============================================================

# ------------------------------------------------------------
# LOCAL
# ------------------------------------------------------------
# Para trabajar en tu PC con PostgreSQL local:
#
# spring.datasource.url=jdbc:postgresql://localhost:5433/mecanosfera_db?options=-c%20timezone=UTC
# spring.datasource.username=mecanosfera
# spring.datasource.password=mecanosfera123


# ------------------------------------------------------------
# PRODUCCION - NEON
# ------------------------------------------------------------
# Render proporciona estas variables de entorno.
#
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}


# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}


# ============================================================
# SERVER
# ============================================================

server.port=${PORT:10000}
