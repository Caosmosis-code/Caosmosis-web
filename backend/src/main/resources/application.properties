spring.application.name=demo

# ============================================================
# BASE DE DATOS - PRODUCCIÓN / NEON
# ============================================================
# Render inyectará SPRING_DATASOURCE_URL desde sus Environment Variables.
# Ejemplo de valor:
# jdbc:postgresql://ep-dawn-fog-ax0hl678-pooler.c-4.us-east-2.aws.neon.tech/caosmosisbd?sslmode=require&channel_binding=require

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ============================================================
# SERVIDOR
# ============================================================

server.port=${PORT:10000}


# ============================================================
# DESARROLLO LOCAL - OPCIONAL
# ============================================================
# Para trabajar localmente sin Neon, puedes reemplazar temporalmente
# las tres variables anteriores por:
#
# spring.datasource.url=jdbc:postgresql://localhost:5432/mecanosfera
# spring.datasource.username=postgres
# spring.datasource.password=TU_PASSWORD_LOCAL
#
# Pero NO es necesario Docker para producción.
